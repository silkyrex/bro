name: sync-upstream

# Weekly check. Pulls new commits from backnotprop/bro into this fork.
# bro changes about once a week, so a weekly run keeps this fork current.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge backnotprop/bro into the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          before=$(gh api "repos/$REPO/commits/$BRANCH" -q .sha)
          gh api -X POST "repos/$REPO/merge-upstream" -f branch="$BRANCH"
          after=$(gh api "repos/$REPO/commits/$BRANCH" -q .sha)
          upstream=$(gh api "repos/backnotprop/bro/commits/main" -q .sha)
          echo "before:   $before"
          echo "after:    $after"
          echo "upstream: $upstream"
          [ "$after" = "$upstream" ] || { echo "::error::Fork does not match upstream HEAD"; exit 1; }
